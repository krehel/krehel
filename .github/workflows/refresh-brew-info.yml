name: Refresh brew info

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stats
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the regenerated cards to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the final step runs git push
      - run: bin/render-brew-info
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changed stats
        run: |
          git diff --quiet -- assets && exit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message="Refresh brew info stats" -- assets
          git push
